<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Таблица пользователей</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        img {
            width: 50px;
            height: 50px;
            object-fit: cover;
        }

        .scrollable {
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <form method="get" action="/">
        <label>Количество пользователей:</label>
        <input type="number" name="count" min="1" max="1000" value="{{ count }}">
        <button type="submit">Загрузить</button>
    </form>
    <div class="scrollable">
        <table>
            <thead>
                <tr>
                    <th>№</th>
                    <th>Пол</th>
                    <th>Имя</th>
                    <th>Фамилия</th>
                    <th>Телефон</th>
                    <th>Email</th>
                    <th>Адрес проживания</th>
                    <th>Фото</th>
                    <th>User-card</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user[0] }}</td>
                    <td>{{ user[1] }}</td>
                    <td>{{ user[2] }}</td>
                    <td>{{ user[3] }}</td>
                    <td>{{ user[4] }}</td>
                    <td>{{ user[5] }}</td>
                    <td>{{ user[6] }}</td>
                    <td><img src="/get-photo/{{ user[0] }}" alt="Фото"></td>
                    <td><a href="/{{ user[0] }}">User-card</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% if show_counter < count %}
    <form method="get" action="/">
        <input type="hidden" name="count" value="{{ count }}">
        <input type="hidden" name="show_counter" value="{{ show_counter + 50 if show_counter + 50 < count else count }}">
        <button type="submit">Развернуть</button>
    </form>
    {% endif %}
</body>

</html>
